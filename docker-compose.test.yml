# Optional throwaway PostgreSQL 9.5 for DB/API tests:
#   docker compose -f docker-compose.test.yml up -d
#   export TEST_DATABASE_URL=postgresql+psycopg2://test:test@127.0.0.1:5433/ghost_test
services:
  testdb:
    image: postgres:9.5
    platform: linux/amd64
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: ghost_test
    ports:
      - "5433:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
